[project]
name = "merchant-compliance-engine"
version = "0.1.0"
description = "AI-powered multi-agent pipeline for merchant compliance pre-qualification"
readme = "README.md"
authors = [
    { name = "khichar-monika15" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.42.0",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.6",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "langchain-anthropic>=0.3.12",
    "langchain-core>=0.3.29",
    "langgraph==0.2.60",
    "lxml>=5.3.0",
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-levenshtein>=0.25.0",
    "python-multipart>=0.0.17",
    "rapidfuzz>=3.9.0",
    "razorpay>=1.4.2",
    "sqlalchemy>=2.0.36",
    "thefuzz>=0.22.1",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]
