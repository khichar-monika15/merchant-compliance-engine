[project]
name = "merchant-compliance-engine"
version = "0.1.0"
description = "AI-powered multi-agent pipeline for merchant compliance pre-qualification"
readme = "README.md"
authors = [
    { name = "khichar-monika15" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
