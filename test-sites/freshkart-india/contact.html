<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - FreshKart India</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="https://www.googletagmanager.com/gtag/js?id=GA-XXXXX"></script>
</head>
<body>
  <header>
    <nav>
      <div class="logo"><a href="/">🥦 FreshKart India</a></div>
    </nav>
  </header>

  <main>
    <section class="page-content">
      <h1>Contact Us</h1>
      <p>Have a question? Drop us an email!</p>

      <!-- RBI Violation: only email, no phone number, no physical address -->
      <div class="contact-info">
        <p><strong>Email:</strong> hello@freshkart.in</p>
        <!-- No phone number -->
        <!-- No physical business address -->
      </div>

      <form class="contact-form" onsubmit="submitForm(event)">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Your message" required></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2024 FreshKart India. All rights reserved.</p>
    <p>Email: hello@freshkart.in</p>
  </footer>
  <script src="/assets/main.js"></script>
</body>
</html>
