name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Without a real browser the crawler raises on launch, the agent catches it into
      # crawl_failed, and every crawl test passes on the exception path instead of the one it
      # names. The suite ran in under six seconds because nothing ever loaded a page.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      # No credentials are configured here on purpose: the suite must pass on a
      # clean clone, and the live LLM smoke test skips itself when unconfigured.
      - name: Run tests
        run: uv run pytest backend/tests/ -v

  # The scores in the README and on the demo buttons are only trustworthy if something checks
  # them. This ran on one machine, by hand, and printed a summary that exited 0 either way.
  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      # serve.py applies each site's declared vercel.json headers. npx serve ignores them, which
      # made every site report its headers missing and PCI-004/005 stop discriminating.
      - name: Serve the four test sites
        run: |
          uv run python test-sites/serve.py &
          for port in 4001 4002 4003 4004; do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/" >/dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$port/" >/dev/null || { echo "port $port never came up"; exit 1; }
          done

      # No credentials, so this is the rule-only path. The harness prints which path it took.
      - name: Validate ground truth
        run: uv run python -m backend.tests.validate_ground_truth

  # "Download PDF" is the browser's print dialog, so the PDF is whatever the print stylesheet
  # renders, and that had never been measured. These tests need the built SPA, which the backend
  # job does not have, so without this job they would quietly skip and guard nothing.
  print-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync
          npm ci --prefix frontend

      - name: Build the frontend
        run: npm run build --prefix frontend

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      # A missing dist/ skips these locally and fails them here, so a broken build step cannot
      # turn the whole file into a green no-op.
      - name: Measure the printed report
        run: uv run pytest backend/tests/test_print_layout.py -v --no-header

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
