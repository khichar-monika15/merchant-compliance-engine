name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Without a real browser the crawler raises on launch, the agent catches it into
      # crawl_failed, and every crawl test passes on the exception path instead of the one it
      # names. The suite ran in under six seconds because nothing ever loaded a page.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      # No credentials are configured here on purpose: the suite must pass on a
      # clean clone, and the live LLM smoke test skips itself when unconfigured.
      - name: Run tests
        run: uv run pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
